    - text: "🥢 Món gọi thêm Hương Sen:\n🍚 Cơm & Bún:\n- Cơm Trắng - 10k\n  Cơm mềm, thơm, ăn kèm món chính\n  Nguyên liệu: Gạo, nước, muối\n- Bún - 10k\n  Sợi bún dai, mềm, dễ ăn\n  Nguyên liệu: Bột gạo, nước\n- Bánh Mì - 5k\n  Giòn bên ngoài, mềm bên trong\n  Nguyên liệu: Bột mì, men, nước, muối\n🥬 Rau & Canh:\n- Rau Củ Luộc - 20k\n  Thanh mát, giữ nguyên vị rau củ\n  Nguyên liệu: Rau củ tươi, muối, nước\n- Soup Bắp Cải - 25k\n  Ngọt tự nhiên từ bắp cải\n  Nguyên liệu: Bắp cải, cà rốt, gia vị chay\n- Canh Chua Ngó Sen - 25k\n  Chua nhẹ, thanh mát\n  Nguyên liệu: Ngó sen, me, cà chua, gia vị chay\n🍱 Món chiên / Cuốn / Nướng:\n- Chả Giò Chay - 25k\n  Giòn rụm, nhân thơm ngon\n  Nguyên liệu: Bánh tráng, rau củ, nấm, gia vị chay\n- Đậu Hủ Chiên Giòn - 20k\n  Vỏ giòn, bên trong mềm\n  Nguyên liệu: Đậu hũ, bột chiên, dầu ăn\n- Bánh Bao Chay - 30k\n  Mềm, nhân đậu và rau củ\n  Nguyên liệu: Bột mì, nhân đậu, rau củ\n- Khoai Tây Chiên - 20k\n  Giòn, thơm, ăn kèm sốt\n  Nguyên liệu: Khoai tây, dầu, muối\n- Xúc Xích Chay - 20k\n  Dai, thơm, hương vị rau củ\n  Nguyên liệu: Đậu nành, rau củ, gia vị chay\n- Chả Đậu Xanh Lá Lốt - 48k\n  Thơm lá lốt, đậm vị đậu xanh\n  Nguyên liệu: Đậu xanh, lá lốt, gia vị chay\n- Nem Chua Chay - 40k\n  Chua nhẹ, thơm, dai ngon\n  Nguyên liệu: Đậu nành lên men, gia vị chay\n- Khoai Lang Mật Chiên Mật Ong - 30k\n  Ngọt thanh, giòn bên ngoài\n  Nguyên liệu: Khoai lang, mật ong, dầu ăn\n- Cà Tím Nướng Mỡ Hành - 45k\n  Mềm thơm, béo mỡ hành\n  Nguyên liệu: Cà tím, hành, dầu ăn, gia vị chay\n- Cà Rốt Nướng Mật Ong Và Hạt Điều - 40k\n  Ngọt tự nhiên, bùi bùi hạt điều\n  Nguyên liệu: Cà rốt, mật ong, hạt điều\n🍘 Snack & Hạt:\n- Hạt Dẻ Rang - 50k\n  Bùi thơm, giòn nhẹ\n  Nguyên liệu: Hạt dẻ, muối, dầu thực vật\n- Snack rong biển chay - 20k\n  Giòn, mặn nhẹ\n  Nguyên liệu: Rong biển, muối, dầu ăn\n- Snack rong nho chay - 20k\n  Mềm, mặn nhẹ, giàu chất xơ\n  Nguyên liệu: Rong nho, muối\n💡 Gọi thêm để ăn no hơn!"

  utter_suggest_food:
    - text: "⭐ Gợi ý combo món ngon tại Hương Sen:\n🟢 Combo Thanh Mát (2 người):\n- Lẩu Chanh Dây - 150k\n- Gỏi Ngó Sen - 55k\n- 2 Trà Ô Long - 60k\n💰 Tổng: ~265k\n🔥 Combo Cay Nồng (4 người):\n- Lẩu Nấm Thái - 250k\n- Nem Cuốn - 150k\n- Bánh Flan - 20k\n- Chè Hạt Sen - 49k\n- 4 Nước Ngọt - 80k\n💰 Tổng: ~549k\n👨‍👩‍👧‍👦 Combo Gia Đình Vui Vẻ (6 người):\n- Lẩu Thập Cẩm - 200k\n- Nem Cuốn Bún Gạo Lứt - 150k\n- Gỏi Nấm Sốt Thái - 50k\n- Cơm Chiên Thảo Mộc - 35k\n- Bánh Mochi - 45k\n- Chè Khoai Dẻo Ngũ Sắc - 35k\n- 6 Trà Cam Quế - 180k\n💰 Tổng: ~695k\n🍽️ Combo Ăn Vặt Vui Vẻ (5 người):\n- Nem Cuốn Bún Gạo Lứt - 150k\n- Khoai Lang Chiên - 35k\n- Nước Ép Dưa Hấu - 30k\n- Chè Khoai Dẻo Ngũ Sắc - 35k\n- Kem Dừa - 30k\n💰 Tổng: ~280k\n📞 Đặt bàn & tư vấn thêm: 0123.546.789"
  
  utter_ask_dish_specialty:
    - text: "👨‍🍳 Món đặc trưng Hương Sen:\n🏆 Top 7 Best-seller:\n1️⃣ Lẩu Trường Thọ - 300k\n   Nước dùng thanh mát, đậm đà rau củ tươi, ăn kèm nấm, đậu hủ và các loại rau đặc trưng.\n2️⃣ Gỏi Ngó Sen - 55k\n   Ngó sen tươi từ Đồng Tháp, kết hợp rau thơm, đậu phộng rang và nước sốt chua ngọt đặc trưng.\n3️⃣ Bún Bò Huế Chay - 40k\n   Chuẩn vị Huế, nước dùng thơm ngon, nêm gia vị tự nhiên, không bột ngọt.\n4️⃣ Chè Hạt Sen Yến - 49k\n   Hạt sen Bá Thiện, yến sào tinh chế, nước cốt dừa thanh nhẹ, món tráng miệng giàu dinh dưỡng.\n5️⃣ Mì Ý Sốt Kem - 60k\n   Sốt kem nấm homemade, kết hợp mì Ý al dente và rau củ tươi, thơm béo, hợp khẩu vị cả trẻ em lẫn người lớn.\n6️⃣ Nem Cuốn Bún Gạo Lứt - 150k\n   Bún gạo lứt, rau sống tươi, cuốn chặt tay, chấm sốt me đặc trưng.\n7️⃣ Cơm Chiên Thảo Mộc - 35k\n   Cơm chiên kết hợp thảo mộc tươi, nấm và đậu hũ, món ăn nhẹ nhàng, tốt cho sức khỏe.\n⭐ Hơn 1000 khách đã trải nghiệm và yêu thích các món đặc trưng này!"

