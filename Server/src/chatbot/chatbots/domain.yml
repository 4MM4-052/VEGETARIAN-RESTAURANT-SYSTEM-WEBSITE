slots:
  dish_name:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: dish_name

  category_name:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: category_name
        
  from_price:
    type: float
    influence_conversation: false
    initial_value: 0
    mappings:
      - type: from_entity
        entity: from_price

  to_price:
    type: float
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: to_price

entities:
  - dish_name
  - category_name
  - from_price
  - to_price
  

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
