  utter_ask_hotpot:
    - text: "🍲 Các món lẩu tại Hương Sen:\n1️⃣ Lẩu Trường Thọ - 300k ⭐\n• Nước dùng thanh mát từ rau củ và nấm, giàu vitamin, phù hợp ăn nhẹ và bổ dưỡng\n• Nguyên liệu: Rau cải, nấm kim châm, nấm đông cô, đậu hủ, bún\n2️⃣ Lẩu Nấm Thái - 250k 🌶️\n• Nước dùng chua cay đậm đà kiểu Thái, nhiều loại nấm tươi, thích hợp cho ai thích vị cay\n• Nguyên liệu: Nấm hương, nấm rơm, sả, ớt, me, rau thơm\n3️⃣ Lẩu Thập Cẩm - 200k\n• Kết hợp nhiều loại rau củ, đậu hủ và nấm, đủ vị ngọt, chua, thanh, phù hợp nhóm đông người\n• Nguyên liệu: Rau muống, cải thảo, đậu hủ, nấm các loại, cà rốt, bắp\n4️⃣ Lẩu Chao - 200k\n• Nước dùng đậm vị chao đặc trưng miền Bắc, thơm mùi chao và gia vị, hợp khẩu vị truyền thống\n• Nguyên liệu: Đậu hủ chao, nấm mèo, rau cải, cà chua, bắp non\n5️⃣ Lẩu Chanh Dây - 150k 🍋\n• Nước dùng thanh mát, hơi chua nhẹ từ chanh dây, giải nhiệt, rất phù hợp mùa hè\n• Nguyên liệu: Chanh dây, nấm tươi, đậu hủ, rau xanh, cà rốt\n👥 Phù hợp: Từ 2 người trở lên\n⏰ Thời gian phục vụ: 15 - 20 phút"

