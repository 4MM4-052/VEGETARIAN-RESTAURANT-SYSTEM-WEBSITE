    - intent: ask_location
    - action: utter_ask_location
    - intent: ask_open_time
    - action: utter_ask_open_time

- story: feedback rồi cảm ơn
  steps:
    - intent: feedback
    - action: utter_feedback
    - intent: thank
    - action: utter_thank


