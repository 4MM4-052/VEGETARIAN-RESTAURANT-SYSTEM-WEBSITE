stories:

# =========================
# BASIC FLOWS
# =========================

- story: chào rồi hỏi menu
  steps:
    - intent: greet
    - action: utter_greet
    - intent: ask_menu
    - action: utter_ask_menu

- story: hỏi menu rồi hỏi món chính
  steps:
    - intent: ask_menu
    - action: utter_ask_menu
    - intent: ask_main_dish
    - action: utter_ask_main_dish

- story: hỏi món chính rồi hỏi tráng miệng
